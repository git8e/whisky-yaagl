name: Build (macOS)

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euxo pipefail
          ls -1 /Applications | grep -E '^Xcode' || true
          CANDIDATE="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "${CANDIDATE}" ] && [ -d "${CANDIDATE}/Contents/Developer" ]; then
            echo "Using ${CANDIDATE}"
            echo "DEVELOPER_DIR=${CANDIDATE}/Contents/Developer" >> "$GITHUB_ENV"
          fi

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Import Developer ID certificate
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        run: Scripts/import_signing_cert.sh

      - name: Build app
        env:
          SKIP_SWIFTLINT: "1"
        run: |
          set -euxo pipefail
          Scripts/build_app.sh \
            --configuration Release \
            --derived-data "$RUNNER_TEMP/DerivedData" \
            --output "$RUNNER_TEMP/whisky-yaagl.app"

      - name: Package app
        run: |
          set -euxo pipefail
          APP="$RUNNER_TEMP/whisky-yaagl.app"
          test -d "$APP"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "whisky-yaagl.app.zip"

      - name: Build DMG
        run: |
          set -euxo pipefail
          APP="$RUNNER_TEMP/whisky-yaagl.app"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          Scripts/make_dmg.sh "$APP" "$VERSION"
          if [ -n "${SIGN_IDENTITY:-}" ]; then
            /usr/bin/codesign --force --timestamp --sign "$SIGN_IDENTITY" "build/whisky-yaagl-$VERSION.dmg"
          fi

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisky-yaagl.app
          path: whisky-yaagl.app.zip

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisky-yaagl.dmg
          path: build/whisky-yaagl-*.dmg

      - name: Remove signing keychain
        if: always() && env.SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$SIGNING_KEYCHAIN" || true
