name: Release

# Building on a version tag publishes a GitHub Release with the
# drag-to-Applications DMG (plus the legacy .app.zip). Run it manually with a
# tag to (re)build an existing release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (for example v0.1.14)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Select Xcode
        run: |
          set -euxo pipefail
          ls -1 /Applications | grep -E '^Xcode' || true
          CANDIDATE="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "${CANDIDATE}" ] && [ -d "${CANDIDATE}/Contents/Developer" ]; then
            echo "Using ${CANDIDATE}"
            echo "DEVELOPER_DIR=${CANDIDATE}/Contents/Developer" >> "$GITHUB_ENV"
          fi

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build
        env:
          SKIP_SWIFTLINT: "1"
        run: |
          set -euxo pipefail
          DERIVED_DATA="$RUNNER_TEMP/DerivedData"
          xcodebuild \
            -project "Whisky.xcodeproj" \
            -scheme "Whisky" \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package app and DMG
        id: package
        run: |
          set -euxo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/whisky-yaagl.app"
          test -d "$APP"

          # Ad-hoc sign so macOS will run it after quarantine removal.
          /usr/bin/codesign --force --deep --sign - "$APP"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"

          ditto -c -k --sequesterRsrc --keepParent "$APP" "whisky-yaagl.app.zip"

          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          Scripts/make_dmg.sh "$APP" "$VERSION"
          echo "dmg=build/whisky-yaagl-$VERSION.dmg" >> "$GITHUB_OUTPUT"

      - name: Resolve the tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the tag matches the app version
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.name }}"
          VERSION="${{ steps.package.outputs.version }}"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "error: tag ($TAG) does not match MARKETING_VERSION ($VERSION)." >&2
            echo "Bump MARKETING_VERSION in Whisky.xcodeproj and re-tag, or tag v$VERSION." >&2
            exit 1
          fi

      - name: Write release notes
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.name }}"
          VERSION="${{ steps.package.outputs.version }}"
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          NOTES="build/release-notes.md"
          {
            printf '## whisky-yaagl %s\n\n' "$VERSION"
            printf 'Bundled as a drag-to-Applications DMG: open it and drag **whisky-yaagl** onto the **Applications** folder.\n\n'
            printf '### Install\n\n'
            printf '1. Download `whisky-yaagl-%s.dmg` below.\n' "$VERSION"
            printf '2. Open it and drag **whisky-yaagl** onto **Applications**.\n'
            printf '3. Ad-hoc signed: if macOS blocks the first launch, right-click the app ▸ **Open**. If it reports the app is damaged, run `xattr -dr com.apple.quarantine /Applications/whisky-yaagl.app`.\n'
            printf '4. On first launch the app guides you through downloading a Wine runtime.\n\n'
            if [ -n "$PREV" ]; then
              printf '**Full changelog**: https://github.com/%s/compare/%s...%s\n\n' "${{ github.repository }}" "$PREV" "$TAG"
            fi
            printf 'A `whisky-yaagl.app.zip` is also attached for anyone who prefers the archive.\n'
          } > "$NOTES"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          TAG="${{ steps.tag.outputs.name }}"
          VERSION="${{ steps.package.outputs.version }}"
          DMG="${{ steps.package.outputs.dmg }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" "whisky-yaagl.app.zip" --clobber
          else
            gh release create "$TAG" "$DMG" "whisky-yaagl.app.zip" \
              --title "whisky-yaagl $VERSION" \
              --notes-file build/release-notes.md
          fi
