name: Release

# Building on a version tag publishes a GitHub Release with the
# drag-to-Applications DMG (plus the legacy .app.zip). Run it manually with a
# tag to (re)build an existing release.
#
# If the repository has a Developer ID certificate and notarization
# credentials, the app and DMG are signed and notarized. That keeps macOS from
# showing Gatekeeper prompts and keeps TCC permissions (Accessibility, Input
# Monitoring, ...) across updates because the signing identity stays stable.
# Without those secrets the workflow falls back to an ad-hoc signature.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (for example v0.1.14)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      # Signing and notarization credentials. All are optional; when absent
      # the build is ad-hoc signed.
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Select Xcode
        run: |
          set -euxo pipefail
          ls -1 /Applications | grep -E '^Xcode' || true
          CANDIDATE="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "${CANDIDATE}" ] && [ -d "${CANDIDATE}/Contents/Developer" ]; then
            echo "Using ${CANDIDATE}"
            echo "DEVELOPER_DIR=${CANDIDATE}/Contents/Developer" >> "$GITHUB_ENV"
          fi

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Import Developer ID certificate
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        run: Scripts/import_signing_cert.sh

      - name: Build app
        env:
          SKIP_SWIFTLINT: "1"
        run: |
          set -euxo pipefail
          Scripts/build_app.sh \
            --configuration Release \
            --derived-data "$RUNNER_TEMP/DerivedData" \
            --output "$RUNNER_TEMP/whisky-yaagl.app"

      - name: Check signature and notarization availability
        id: signature
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/whisky-yaagl.app"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"

          if /usr/bin/codesign -dvv "$APP" 2>&1 | grep -q '^Authority=Developer ID Application'; then
            SIGNED=1
            echo "signed=1" >> "$GITHUB_OUTPUT"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            SIGNED=0
            echo "signed=0" >> "$GITHUB_OUTPUT"
            echo "SIGNED=0" >> "$GITHUB_ENV"
          fi

          # Notarization credentials are optional. Prefer an App Store Connect
          # API key when present; otherwise use an Apple ID app-specific
          # password.
          if [ "$SIGNED" = "1" ] && {
              [ -n "${APPSTORE_API_PRIVATE_KEY:-}" ] \
              || { [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; };
          }; then
            echo "NOTARIZE=1" >> "$GITHUB_ENV"
          else
            echo "NOTARIZE=0" >> "$GITHUB_ENV"
          fi
          echo "NOTARIZED=0" >> "$GITHUB_ENV"

      - name: Notarize app
        if: env.NOTARIZE == '1'
        run: |
          set -euxo pipefail
          Scripts/notarize.sh "$RUNNER_TEMP/whisky-yaagl.app"
          echo "NOTARIZED=1" >> "$GITHUB_ENV"

      - name: Package app and DMG
        id: package
        run: |
          set -euxo pipefail
          APP="$RUNNER_TEMP/whisky-yaagl.app"
          test -d "$APP"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"

          # Recreate the archive after stapling so it contains the notarization
          # ticket when the app was notarized.
          ditto -c -k --sequesterRsrc --keepParent "$APP" "whisky-yaagl.app.zip"

          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          Scripts/make_dmg.sh "$APP" "$VERSION"
          DMG="build/whisky-yaagl-$VERSION.dmg"

          if [ "$SIGNED" = "1" ]; then
            /usr/bin/codesign --force --timestamp --sign "$SIGN_IDENTITY" "$DMG"
            /usr/bin/codesign --verify --verbose=2 "$DMG"
          fi
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"

      - name: Notarize DMG
        if: env.NOTARIZED == '1'
        run: |
          set -euxo pipefail
          Scripts/notarize.sh "${{ steps.package.outputs.dmg }}"

      - name: Resolve the tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the tag matches the app version
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.name }}"
          VERSION="${{ steps.package.outputs.version }}"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "error: tag ($TAG) does not match MARKETING_VERSION ($VERSION)." >&2
            echo "Bump MARKETING_VERSION in Whisky.xcodeproj and re-tag, or tag v$VERSION." >&2
            exit 1
          fi

      - name: Write release notes
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.name }}"
          VERSION="${{ steps.package.outputs.version }}"
          DMG="${{ steps.package.outputs.dmg }}"
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          NOTES="build/release-notes.md"

          if [ "$SIGNED" = "1" ] && [ "$NOTARIZED" = "1" ]; then
            SIGNING_NOTE="Developer ID signed and notarized"
          elif [ "$SIGNED" = "1" ]; then
            SIGNING_NOTE="Developer ID signed (notarization skipped)"
          else
            SIGNING_NOTE="ad-hoc signed; macOS may require manual approval and may reset permissions after an update"
          fi

          # Match the notes style used by previous releases: a changelog of the
          # commits since the last tag, then a Validation block and the SHA256
          # of each artifact.
          {
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty=format:'- %s' "$PREV..$TAG"
              printf '\n'
            fi
            printf '\nValidation:\n'
            printf -- '- GitHub Actions macOS build passed (macOS 15, Release, %s)\n\n' "$SIGNING_NOTE"
            if [ "$SIGNED" != "1" ]; then
              printf '> This build is not signed with a Developer ID certificate. Configure the signing secrets in the repository to remove Gatekeeper prompts and keep permissions across updates.\n\n'
            elif [ "$NOTARIZED" != "1" ]; then
              printf '> This build is signed but was not notarized. macOS may still ask for approval on first launch.\n\n'
            fi
            printf 'SHA256:\n'
            printf -- '- %s: %s\n' "$(basename "$DMG")" "$(shasum -a 256 "$DMG" | awk '{print $1}')"
            printf -- '- whisky-yaagl.app.zip: %s\n' "$(shasum -a 256 whisky-yaagl.app.zip | awk '{print $1}')"
          } > "$NOTES"
          cat "$NOTES"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          TAG="${{ steps.tag.outputs.name }}"
          VERSION="${{ steps.package.outputs.version }}"
          DMG="${{ steps.package.outputs.dmg }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" "whisky-yaagl.app.zip" --clobber
          else
            gh release create "$TAG" "$DMG" "whisky-yaagl.app.zip" \
              --title "whisky-yaagl $VERSION" \
              --notes-file build/release-notes.md
          fi

      - name: Remove signing keychain
        if: always() && env.SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$SIGNING_KEYCHAIN" || true
